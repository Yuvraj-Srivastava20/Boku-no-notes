<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boku No Notes - Workspace</title>
    <link rel="stylesheet" href="app.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body data-theme="dark">
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2 id="brandTitle">Boku No Notes</h2>
            </div>

            <div class="search-box">
                <input type="text" id="findNoteInput" placeholder="Enter title here (Press Enter)...">
            </div>

            <div class="room-info">
                <span>Room: <strong id="roomCodeDisplay">---</strong></span>
                <button id="changeRoomBtn" class="btn-room-change" title="Change Room Code">⚙️ Edit Room</button>
            </div>

            <hr class="sidebar-divider">
            <button id="newBtn" class="sidebar-add-btn" title="New Note/List">+ New Item</button>
            <div class="notes-list" id="notesList"></div>

            <div class="sidebar-footer">
                <button id="themeToggleBtn" title="Toggle Theme">☀️ / 🌙 Theme</button>
            </div>
        </aside>

        <!-- Main Workspace -->
        <main class="workspace" id="workspace">
            <div class="workspace-empty fade-in" id="emptyState">
                <p>No note open. Select a note from the sidebar or click '+ New Item' to create one.</p>
            </div>

            <div class="workspace-active hidden fade-in" id="activeWorkspace">
                <div class="workspace-header">
                    <h1 id="currentNoteTitle">Untitled</h1>
                    <span id="syncStatus" class="status-saved">Saved</span>
                </div>

                <!-- Text Customization Toolbar -->
                <div class="text-toolbar">
                    <label>Font Size:
                        <select id="fontSizeSelect">
                            <option value="14px">Small</option>
                            <option value="16px" selected>Normal</option>
                            <option value="18px">Large</option>
                            <option value="22px">Extra Large</option>
                        </select>
                    </label>
                    <label>Font Style:
                        <select id="fontStyleSelect">
                            <option value="sans-serif">Sans-Serif</option>
                            <option value="serif">Serif</option>
                            <option value="monospace">Monospace</option>
                            <option value="cursive" selected>Cursive</option>
                        </select>
                    </label>
                    <label>Text Color:
                        <input type="color" id="textColorPicker" value="#cdd6f4">
                    </label>
                    
                    <div class="panel-toggle-controls">
                        <button id="toggleEditorPaneBtn" class="btn-panel-toggle" title="Toggle Editor">📝 Text Area</button>
                        <button id="togglePreviewPaneBtn" class="btn-panel-toggle" title="Toggle Preview">👁️ Preview Area</button>
                        <button id="toggleClipboardBtn" class="btn-panel-toggle" title="Toggle Side Clipboard">📋 Clipboard (<span id="clipCount">0</span>)</button>
                    </div>
                </div>

                <div class="main-editor-area">
                    <div class="editor-container" id="editorContainer">
                        <div class="editor-wrapper" id="editorPane">
                            <div id="line-numbers" class="line-numbers">1</div>
                            <textarea id="note-editor" spellcheck="true" autocomplete="on" autocorrect="on" capitalize="off" placeholder="Write plain text lines or standard Markdown here..."></textarea>
                        </div>
                        
                        <!-- Resizable Splitter Bar -->
                        <div class="resizer" id="dragResizer"></div>

                        <div id="output" class="markdown-preview"></div>
                    </div>

                    <!-- Side-by-Side Collapsible Clipboard Panel -->
                    <aside id="clipboardPanel" class="clipboard-panel hidden">
                        <div class="clipboard-header">
                            <h3>Clipboard History</h3>
                            <button id="closeClipboardBtn" class="close-panel-btn">&times;</button>
                        </div>
                        <div id="clipboardItems" class="clipboard-items-list"></div>
                    </aside>
                </div>
            </div>
        </main>
    </div>

    <!-- New Item Dialog -->
    <dialog id="newItemModal" class="pop-in">
        <form id="newItemForm" method="dialog">
            <h3>Create New Item</h3>
            <label for="itemType">Type:</label>
            <select id="itemType">
                <option value="note">Note</option>
                <option value="list">List</option>
            </select>
            
            <label for="itemName">Name:</label>
            <input type="text" id="itemName" placeholder="Enter name of note or list" required>

            <div class="dialog-actions">
                <button type="button" id="cancelDialogBtn">Cancel</button>
                <button type="submit" id="createDialogBtn">Create</button>
            </div>
        </form>
    </dialog>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="app.js"></script>
</body>
</html>
