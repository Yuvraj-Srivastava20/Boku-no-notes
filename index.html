<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boku No Notes - Home</title>
    <link rel="stylesheet" href="home.css">
</head>
<body data-theme="dark">

    <header>
        <div class="brand">
            <h1>Boku No Notes</h1>
        </div>
    </header>

    <main class="hero-section">
        <h1 class="hero-title">Boku No Notes</h1>
        <p class="hero-subtitle">Your personal real-time cloud markdown & checklist workspace.</p>

        <div class="room-actions">
            <button type="button" id="create-room-btn" class="btn-primary">Create New Room</button>
            <button type="button" id="join-room-btn" class="btn-secondary">Join Existing Room</button>
        </div>
    </main>

    <!-- Modal for Joining Existing Room -->
    <div id="join-modal" class="modal-overlay hidden">
        <div class="modal-card">
            <h3>Join Existing Room</h3>
            <p>Enter your 4-digit room code below:</p>
            <input type="text" id="room-code-input" placeholder="e.g. 8492" maxlength="6">
            <div class="modal-buttons">
                <button type="button" id="confirm-join-btn" class="btn-primary">Join Room</button>
                <button type="button" id="close-modal-btn" class="btn-secondary">Cancel</button>
            </div>
        </div>
    </div>

    <script src="home.js"></script>
</body>
</html>
